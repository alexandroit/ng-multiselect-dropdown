name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.3, 24.15.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Validate compatibility fixture catalog
        if: matrix.node == '22.22.3'
        run: npm run test:fixtures
      - run: npm run test:ci
      - run: npm run build:package
      - run: npm audit --omit=optional --audit-level=high
      - name: Validate Angular compatibility fixtures
        if: matrix.node == '22.22.3'
        run: npm run test:compatibility
      - name: Build current documentation
        if: matrix.node == '22.22.3'
        run: |
          npm run docs:install:angular-21
          npm run build:docs:angular-21
      - name: Build release artifact
        if: matrix.node == '22.22.3'
        run: |
          mkdir release
          (cd dist-lib && npm pack --ignore-scripts --pack-destination ../release)
          (cd release && sha512sum *.tgz > SHA512SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == '22.22.3'
        with:
          name: ${{ github.event.repository.name }}-release
          path: release/
          if-no-files-found: error
          retention-days: 30
